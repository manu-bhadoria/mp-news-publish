name: publish
# Started by the MP News portal (workflow_dispatch) each time a story is published, edited or removed.
on:
  workflow_dispatch:
concurrency:
  group: publish
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tools
        run: pip install --quiet blake3 pillow
      - name: Site data (as the laptop last uploaded it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work
          gh release download state --repo "$GITHUB_REPOSITORY" --dir work --pattern '*.tar.zst'
      - name: Build and upload
        env:
          BUILD_KEY: ${{ secrets.BUILD_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PORTAL_URL: ${{ vars.PORTAL_URL || 'https://mp-news-dashboard.nihilycho.workers.dev' }}
          TZ: Asia/Kolkata
        run: python3 -u tools/publish.py
